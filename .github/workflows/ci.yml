# The CI of the template: creates a project of every kind from the commit under test (tests/create_project.py: the
# template rendered by copier, plus a hello world), then runs what a developer runs in it: the setup script, pre-commit
# on every file (nothing may change: the rendered files are already formatted), pytest --run-all.
name: CI

on:
  workflow_dispatch:
  # weekly run on main, Sun 20:00 CET: first in the queue, with cs-pre-commit-hooks (the tools at 20:15)
  schedule:
    - cron: "0 19 * * 0"
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  create-project:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        kind: [tool, project]
        include:
          - { os: ubuntu-latest, kind: library }

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install copier
        run: python -m pip install copier

      - name: Create a ${{ matrix.kind }} with a hello world
        run: python tests/create_project.py ${{ matrix.kind }} "${{ runner.temp }}/hello"
        shell: bash

      - name: Setup (Linux, macOS)
        if: runner.os != 'Windows' && matrix.kind != 'library'
        working-directory: ${{ runner.temp }}/hello
        run: ./setup.sh
        shell: bash

      - name: Setup (Windows)
        if: runner.os == 'Windows' && matrix.kind != 'library'
        working-directory: ${{ runner.temp }}/hello
        run: .\setup.ps1
        shell: pwsh

      - name: Setup (library, pre-commit only)
        if: matrix.kind == 'library'
        working-directory: ${{ runner.temp }}/hello
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pre-commit
        shell: bash

      - name: pre-commit and pytest (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/hello
        run: |
          source .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure
          if [ "${{ matrix.kind }}" != "library" ]; then pytest --run-all -ra; fi
        shell: bash

      - name: pre-commit and pytest (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/hello
        run: |
          .\.venv\Scripts\Activate.ps1
          pre-commit run --all-files --show-diff-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pytest --run-all -ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

  # the one stable check name for rulesets
  ci-ok:
    if: always()
    needs: [create-project]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: test "${{ needs.create-project.result }}" = "success"
