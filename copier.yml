# cs-project-template: the shared files of every cscosine repository (base layer, PLAN-cscosine-org.md S3).
# Which file belongs to whom: README.md.

_subdirectory: template
_min_copier_version: "9.4"
_answers_file: .copier-answers.yml

# files a kind does not get (the template files keep their plain names)
_exclude:
  # library: C++ only, no Python, no build CI of its own
  - "{% if kind == 'library' %}setup.sh*{% endif %}"
  - "{% if kind == 'library' %}setup.ps1*{% endif %}"
  - "{% if kind == 'library' %}conftest.py{% endif %}"
  - "{% if kind == 'library' %}pyproject.toml*{% endif %}"
  - "{% if kind == 'library' %}.github/release.yml{% endif %}"
  # the tests skeleton: created with a new repository only, never added by an update
  - "{% if kind == 'library' or _copier_operation == 'update' %}tests{% endif %}"
  # the package skeleton of a tool (src/ layout): created with a new repository only
  - "{% if kind != 'tool' or _copier_operation == 'update' %}src{% endif %}"
  # checks.yml for every kind; the build CI (ci.yml) for a tool only (a project's is generated by csorchestrator, a
  # library is built by its project): the other files of .github/workflows are never touched
  - "{% if kind != 'tool' %}.github/workflows/ci.yml{% endif %}"

# ---------------------------------------------------------------------------------------------------------------------
# questions
# ---------------------------------------------------------------------------------------------------------------------

project_name:
  type: str
  help: Repository name (e.g. csfoundation)

description:
  type: str
  help: One line describing the repository

kind:
  type: str
  help: Kind of repository
  choices:
    "tool: Python package under src/ with its own CI (csCMake, csorchestrator, csWiki)": tool
    "project: csorchestrator recipe, with or without C++ sources of its own (distributions, applications)": project
    "library: first-party C++, built by the project that consumes it, no build CI of its own (the checks only)": library

# derived, never asked nor stored: names used in paths (no filter in a path: "|" is not valid in a Windows file name)
package_name:
  type: str
  default: "{{ project_name | lower | replace('-', '_') }}"
  when: false

tests_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

csorchestrator_version:
  type: str
  help: csorchestrator tag installed by setup.sh / setup.ps1 by default
  # for a new project: the project keeps its answer, moved with `copier update -d csorchestrator_version=<tag>`
  default: v0.1.0
  when: "{{ kind == 'project' }}"

workspace_dir:
  type: str
  help: Folder of the csorchestrator runs (checkouts, builds, installs, deploy archives), the base_target_dir of the recipe; git, mypy, pytest and VS Code ignore it
  default: workspace
  when: "{{ kind == 'project' }}"

claude_plugins:
  type: yaml
  multiselect: true
  help: >-
    Plugins of the cscosine marketplace (cscosine/.github) Claude Code enables in this repository, besides cs-org (always):
    the tools and libraries the repository uses
  choices:
    "cscmake: using csCMake (CMake projects, libraries)": cscmake
    "csorchestrator: using csorchestrator (projects)": csorchestrator
    "csfoundation: the csCore, csLie, csCamera, csVisOpenGL libraries": csfoundation
    "csoptimization: the csNelson, csBlockMatrix libraries": csoptimization
  default: "{% if kind == 'project' %}[cscmake, csorchestrator]{% elif kind == 'library' %}[cscmake]{% else %}[]{% endif %}"
